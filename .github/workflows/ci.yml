name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify 82-project migration manifest
        run: |
          python3 tools/verify_port_manifest.py
          python3 tools/verify_public_api_manifest.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked --version 0.19.4 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
      - name: Check advisories, licenses, bans and sources
        run: |
          python3 tools/verify_supply_chain_policy.py
          cargo deny check
      - name: Audit lockfile
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0134
