[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "Temporary RBatis/RBDC transitive dependency; remove before 1.0.0 or by 2026-09-30, whichever comes first" },
    { id = "RUSTSEC-2024-0436", reason = "No maintained paste replacement is available through jemalloc_pprof 0.9.0; remove the heap profiler or upgrade by 2026-09-30" },
    { id = "RUSTSEC-2026-0049", reason = "Latest rumqttc 0.25.1 pins rustls-webpki 0.102.8; upgrade rumqttc or replace the affected transport by 2026-09-30" },
    { id = "RUSTSEC-2026-0098", reason = "Latest rumqttc 0.25.1 pins rustls-webpki 0.102.8; upgrade rumqttc or replace the affected transport by 2026-09-30" },
    { id = "RUSTSEC-2026-0099", reason = "Latest rumqttc 0.25.1 pins rustls-webpki 0.102.8; upgrade rumqttc or replace the affected transport by 2026-09-30" },
    { id = "RUSTSEC-2026-0104", reason = "Latest rumqttc 0.25.1 pins rustls-webpki 0.102.8; upgrade rumqttc or replace the affected transport by 2026-09-30" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["rbatis-plus"]
